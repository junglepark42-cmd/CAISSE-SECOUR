<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caisse secours Jungle Park</title><style>body{font:16px system-ui;background:#f4f6f8;color:#17212b;margin:16px}button,input,select{font:inherit;padding:13px;border:1px solid #bbb;border-radius:9px}button{cursor:pointer;background:white}h1{font-size:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}.item{min-height:78px;background:#e9f6ec}.panel{background:white;border-radius:12px;padding:16px;margin-top:16px}li{margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:#176c37;color:white}.total{font-size:28px;font-weight:bold}input{max-width:170px}</style><h1>🧾 Caisse secours — Jungle Park</h1><p>Suivi temporaire des ventes • données conservées sur cet appareil • exporter régulièrement</p><div class="grid" id="products"></div><div class="panel"><h2>Panier</h2><ul id="basket"></ul><p class="total" id="total">0,00 €</p><label>Paiement <select id="mode"><option>CB</option><option>Espèces</option><option>CB + espèces</option></select></label> <label id="mixed" hidden>Montant CB <input id="cb" type="number" min="0" step=".01" value="0"></label><div class="actions" style="margin-top:12px"><button class="primary" id="pay">Valider la vente</button><button id="clear">Vider panier</button></div><p id="msg" role="status"></p></div><div class="panel"><h2>Bilan du jour</h2><p id="stats"></p><div class="actions"><button id="export">Exporter toutes les ventes (CSV)</button><button id="undo">Annuler dernière vente</button></div><h3>Historique</h3><ol id="history"></ol></div><script>
const catalog=[["Entrée 0-3 ans",6.5],["Entrée 4-12 ans",10],["Entrée + goûter 0-3 ans",9.5],["Entrée + goûter 4-12 ans",13],["Entrée adulte",3],["Entrée + repas 0-3 ans",11.5],["Entrée + repas 4-12 ans",15],["Entrée adulte + repas",9],["Place",7],["Goûter",3],["Boisson",2],["Jeton moto",1],["6 jetons moto",5]];
const endpoint="https://script.google.com/macros/s/AKfycbw46B1z20XzDkOMF5FD0mXUTITDm7K0eowmdzKr8_MuwHGzx53bxJhUDhD1d-LAWwFl/exec";const pendingKey="jungle_pending_sync_v1";const key="jungle_caisse_secours_v1",money=n=>Number(n).toFixed(2).replace(".",",")+" €";let cart={};let sales=[];try{sales=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){alert("Impossible de lire les ventes enregistrées");}const $=id=>document.getElementById(id),total=()=>catalog.reduce((s,p,i)=>s+(cart[i]||0)*p[1],0);function render(){ $("basket").innerHTML="";catalog.forEach((p,i)=>{if(!cart[i])return;let li=document.createElement("li");li.textContent=cart[i]+" × "+p[0]+" — "+money(cart[i]*p[1])+" ";let b=document.createElement("button");b.textContent="− 1";b.onclick=()=>{cart[i]--;render()};li.append(b);$("basket").append(li)});$("total").textContent=money(total());let today=new Date().toLocaleDateString("fr-FR");let day=sales.filter(s=>s.date===today);$("stats").textContent=day.length+" vente(s) • CA "+money(day.reduce((s,v)=>s+v.total,0))+" • CB "+money(day.reduce((s,v)=>s+v.cb,0))+" • Espèces "+money(day.reduce((s,v)=>s+v.cash,0));$("history").innerHTML="";day.slice().reverse().forEach(v=>{let li=document.createElement("li");li.textContent=v.time+" — "+money(v.total)+" (CB "+money(v.cb)+", espèces "+money(v.cash)+") — "+v.items.map(x=>x.qty+"× "+x.name).join(", ");$("history").append(li)})}catalog.forEach((p,i)=>{let b=document.createElement("button");b.className="item";b.textContent=p[0]+"\n"+money(p[1]);b.style.whiteSpace="pre-line";b.onclick=()=>{cart[i]=(cart[i]||0)+1;render()};$("products").append(b)});$("mode").onchange=()=>{$("mixed").hidden=$("mode").value!=="CB + espèces"};$("clear").onclick=()=>{cart={};render()};$("pay").onclick=()=>{let cents=Math.round(total()*100);if(!cents)return;let mode=$("mode").value;let cb=mode==="CB"?cents:mode==="Espèces"?0:Math.round(Number($("cb").value)*100);if(!Number.isFinite(cb)||cb<0||cb>cents){$("msg").textContent="Montant CB invalide";return}let now=new Date();let sale={id:now.getTime()+"-"+Math.random().toString(36).slice(2,8),date:now.toLocaleDateString("fr-FR"),time:now.toLocaleTimeString("fr-FR"),items:catalog.map((p,i)=>({name:p[0],qty:cart[i]||0,unit:p[1]})).filter(x=>x.qty),total:cents/100,cb:cb/100,cash:(cents-cb)/100,mode};let next=[...sales,sale];try{localStorage.setItem(key,JSON.stringify(next));sales=next;cart={};$("msg").textContent="Vente sauvegardée localement, synchronisation en cours";render();syncSales()}catch(e){$("msg").textContent="ERREUR : vente non enregistrée !"}};$("undo").onclick=()=>{if(!sales.length||!confirm("Annuler la dernière vente enregistrée ?"))return;let next=sales.slice(0,-1);try{localStorage.setItem(key,JSON.stringify(next));sales=next;render()}catch(e){alert("Échec de l'annulation")}};$("export").onclick=()=>{let rows=[["ID","Date","Heure","Produit","Quantité","Prix unitaire","Total ligne","Total vente","CB","Espèces","Mode"]];sales.forEach(s=>s.items.forEach(x=>rows.push([s.id,s.date,s.time,x.name,x.qty,x.unit,x.qty*x.unit,s.total,s.cb,s.cash,s.mode])));let csv="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(";")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="jungle-ventes-"+new Date().toISOString().slice(0,10)+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};async function syncSales(){let done;try{done=JSON.parse(localStorage.getItem(pendingKey)||"[]")}catch(e){done=[]}for(const sale of sales){if(done.includes(sale.id))continue;try{const body=new URLSearchParams();body.set("vente",JSON.stringify(sale));await fetch(endpoint,{method:"POST",mode:"no-cors",body});$("msg").textContent="Envoi tenté vers Google Sheets — confirmation non vérifiable";}catch(e){$("msg").textContent="Hors ligne : vente conservée sur cet appareil";break}}}window.addEventListener("online",syncSales);render();syncSales();
</script></html>
